name: Rotate Telegram Webhook Secret

# Auto-rotate TELEGRAM_WEBHOOK_SECRET on a monthly cadence.
#
# What this does (per DEPLOYMENT.md § Telegram Webhook Secret Rotation):
#   1. Generate a fresh 256-bit hex secret (openssl rand -hex 32).
#   2. Call Telegram Bot API setWebhook with the same URL and secret_token=S_new.
#   3. npx convex env set TELEGRAM_WEBHOOK_SECRET S_new (deploys the new
#      value to the Convex runtime — hot-reloads within ~1-2 seconds).
#   4. Send an OPTIONAL smoke test (get bot info) and verify Telegram
#      accepted the new secret.
#
# Cadence: monthly, on the 1st of each month at 03:15 UTC (11:15 SGT).
#   - Annual is too rare to justify automation.
#   - Weekly is overkill (each rotation has a ~1-2 s propagation window;
#     you don't want 52 of those per year even under Telegram's retry
#     contract).
#   - Monthly = 12 rotation windows per year, all masked by Telegram's
#     exponential-backoff retries. Change the cron below if you want a
#     different cadence.
#
# Manual trigger: workflow_dispatch is enabled so you can rotate on
# demand (e.g. after an incident, or the first time you arm this) from
# the Actions tab. No code change needed to run manually.
#
# Required repository secrets (add via GitHub Settings -> Secrets and
# variables -> Actions):
#   TELEGRAM_BOT_TOKEN            The bot's API token from @BotFather.
#                                 Same value as the one in Convex env.
#   CONVEX_DEPLOY_KEY             A Convex production deploy key (prod:
#                                 prefix) with permission to run
#                                 `npx convex env set` and hot-reload
#                                 the deployment.
#   CONVEX_WEBHOOK_URL            The full Telegram webhook URL, e.g.
#                                 https://<deployment>.convex.site/telegram/webhook
#
# Optional repository variable (Settings -> Secrets and variables ->
# Actions -> Variables tab, NOT Secrets):
#   TELEGRAM_ROTATION_ENABLED     Set to "true" to arm the workflow. If
#                                 unset or any other value, the workflow
#                                 short-circuits with a clear message and
#                                 does NOT touch the bot or the Convex
#                                 env. This is the safety switch — the
#                                 workflow file can land on main without
#                                 rotating anything until you flip this
#                                 variable to "true".
#
# What happens if secrets are missing:
#   - If TELEGRAM_BOT_TOKEN, CONVEX_DEPLOY_KEY, or CONVEX_WEBHOOK_URL is
#     missing, the "arm-check" step exits early with a message. No env
#     set, no setWebhook call. Safe to land the file first and add
#     secrets later.
#
# Rollback: rotation is monotonic and safe under Telegram's retry
# contract (see DEPLOYMENT.md § Telegram Webhook Secret Rotation
# "Propagation window"). If a rotation causes issues, re-run the
# workflow manually to install another fresh secret — there is no
# separate rollback path because there is no persisted rollback state.

on:
  schedule:
    # First of every month at 03:15 UTC (11:15 SGT).
    - cron: "15 3 1 * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run — generate S_new and log actions but do not call Telegram or Convex."
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

# Never surface the new secret in workflow logs.
permissions:
  contents: read

jobs:
  rotate:
    name: Rotate TELEGRAM_WEBHOOK_SECRET
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Arm check
        id: arm
        env:
          # Repository VARIABLE (not secret). If unset, defaults to "false".
          ROTATION_ENABLED: ${{ vars.TELEGRAM_ROTATION_ENABLED }}
          # Presence of these SECRETS gates real execution. GitHub
          # Actions represents missing secrets as empty strings.
          HAS_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN != '' }}
          HAS_CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY != '' }}
          HAS_WEBHOOK_URL: ${{ secrets.CONVEX_WEBHOOK_URL != '' }}
        run: |
          set -euo pipefail
          if [ "${ROTATION_ENABLED:-}" != "true" ]; then
            echo "TELEGRAM_ROTATION_ENABLED is not 'true'. Rotation is DISARMED."
            echo "Set repository variable TELEGRAM_ROTATION_ENABLED=true to arm."
            echo "armed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${HAS_BOT_TOKEN}" != "true" ] || \
             [ "${HAS_CONVEX_DEPLOY_KEY}" != "true" ] || \
             [ "${HAS_WEBHOOK_URL}" != "true" ]; then
            echo "One or more required secrets are missing:"
            echo "  TELEGRAM_BOT_TOKEN present: ${HAS_BOT_TOKEN}"
            echo "  CONVEX_DEPLOY_KEY  present: ${HAS_CONVEX_DEPLOY_KEY}"
            echo "  CONVEX_WEBHOOK_URL present: ${HAS_WEBHOOK_URL}"
            echo "Add them under Settings -> Secrets and variables -> Actions."
            echo "armed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "armed=true" >> "$GITHUB_OUTPUT"

      - name: Generate S_new
        if: steps.arm.outputs.armed == 'true'
        id: mint
        run: |
          set -euo pipefail
          # 256 bits of entropy from OpenSSL's CSPRNG. Never echoed
          # to logs — passed via a masked GitHub Actions output only.
          S_NEW="$(openssl rand -hex 32)"
          # Register the value as a workflow secret so any subsequent
          # `echo` of it (accidental or otherwise) is auto-masked.
          echo "::add-mask::${S_NEW}"
          # Use environment file passthrough (masked) rather than
          # ::set-output:: (deprecated) or a plain echo.
          {
            echo "S_NEW<<__EOF__"
            echo "${S_NEW}"
            echo "__EOF__"
          } >> "$GITHUB_OUTPUT"
          echo "Generated a new 256-bit hex secret."

      - name: Call Telegram setWebhook with S_new
        if: steps.arm.outputs.armed == 'true'
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          WEBHOOK_URL: ${{ secrets.CONVEX_WEBHOOK_URL }}
          S_NEW: ${{ steps.mint.outputs.S_NEW }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
        run: |
          set -euo pipefail
          if [ "${DRY_RUN}" = "true" ]; then
            echo "DRY RUN: would call Telegram setWebhook with url=${WEBHOOK_URL} and secret_token=<masked>"
            exit 0
          fi
          # `-sS` — silent but errors surface. `--fail-with-body` — non-2xx
          # fails the step with the response body captured. `--data-urlencode`
          # so a `+` or `%` in URL/secret is encoded correctly.
          RESPONSE=$(curl -sS --fail-with-body \
            "https://api.telegram.org/bot${BOT_TOKEN}/setWebhook" \
            --data-urlencode "url=${WEBHOOK_URL}" \
            --data-urlencode "secret_token=${S_NEW}" \
            --data "allowed_updates=[\"message\",\"callback_query\"]")
          # Telegram returns `{"ok":true,...}` on success. Verify.
          if ! echo "${RESPONSE}" | grep -q '"ok":true'; then
            echo "Telegram setWebhook did not return ok=true:"
            echo "${RESPONSE}"
            exit 1
          fi
          echo "Telegram setWebhook accepted S_new."

      - name: Install S_new on Convex
        if: steps.arm.outputs.armed == 'true'
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
          S_NEW: ${{ steps.mint.outputs.S_NEW }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
        run: |
          set -euo pipefail
          if [ "${DRY_RUN}" = "true" ]; then
            echo "DRY RUN: would run npx convex env set TELEGRAM_WEBHOOK_SECRET <masked>"
            exit 0
          fi
          # `--yes` to skip the interactive confirmation prompt.
          # Convex hot-reloads env changes; no separate deploy step
          # is required. The propagation window is ~1-2 s during
          # which Telegram retries mask any rejected update.
          npx --yes convex env set TELEGRAM_WEBHOOK_SECRET "${S_NEW}"
          echo "Convex env set."

      - name: Verify with getWebhookInfo
        if: steps.arm.outputs.armed == 'true'
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
        run: |
          set -euo pipefail
          if [ "${DRY_RUN}" = "true" ]; then
            echo "DRY RUN: would call Telegram getWebhookInfo"
            exit 0
          fi
          # Sleep a beat so Convex has time to hot-reload the env
          # before we prod Telegram. Empirically ~1-2 s is enough;
          # 5 s is a safe buffer that still keeps the job under
          # the 5-minute timeout.
          sleep 5
          RESPONSE=$(curl -sS --fail-with-body \
            "https://api.telegram.org/bot${BOT_TOKEN}/getWebhookInfo")
          if ! echo "${RESPONSE}" | grep -q '"ok":true'; then
            echo "Telegram getWebhookInfo did not return ok=true:"
            echo "${RESPONSE}"
            exit 1
          fi
          # Telegram's getWebhookInfo returns has_custom_certificate,
          # pending_update_count, and url — but NOT the current
          # secret_token (there is no readback for security reasons).
          # Success of setWebhook + a non-error getWebhookInfo is the
          # best available signal; end-to-end verification requires a
          # real inbound update.
          echo "getWebhookInfo returned ok=true. Rotation complete."

      - name: Summary
        if: always()
        run: |
          if [ "${{ steps.arm.outputs.armed }}" = "true" ]; then
            if [ "${{ inputs.dry_run || 'false' }}" = "true" ]; then
              echo "Dry run complete. No changes were made to Telegram or Convex."
            else
              echo "Rotation complete. TELEGRAM_WEBHOOK_SECRET has been rotated."
              echo "Next automatic rotation: first of next month at 03:15 UTC."
            fi
          else
            echo "Rotation was disarmed or missing secrets. No action taken."
            echo "See the 'Arm check' step above for the reason."
          fi
